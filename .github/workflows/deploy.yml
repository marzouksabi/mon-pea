name: Mise à jour des cours et publication

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 18 * * 1-5'   # chaque soir de semaine, après la clôture de Paris
    - cron: '40 21 * * 1-5'   # après la clôture de New York (indices du repli)
    - cron: '*/15 19-21 * * 1-5'   # cours du moment autour de la clôture de New York (application Repli)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mettre à jour les cours
        if: github.event.schedule != '*/15 19-21 * * 1-5'
        run: python scripts/update_data.py
      - name: Relever les cours du moment
        run: python scripts/update_live.py || true
      - name: Enregistrer les nouvelles données
        if: github.event.schedule != '*/15 19-21 * * 1-5'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Mise à jour des cours" && git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
